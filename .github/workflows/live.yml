name: Update live fire data

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - run: python scripts/f_fetch_live.py
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      - name: Commit new data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/live_hotspots.json
          git diff --staged --quiet || git commit -m "Update live data"
          git push